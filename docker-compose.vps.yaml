services:
  # Rust backend (replaces PHP)
  backend:
    build:
      context: ./4get-rs
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3001/healthz.php
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
