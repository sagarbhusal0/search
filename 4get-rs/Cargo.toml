[package]
name = "4get"
version = "0.1.0"
edition = "2021"
description = "4get search engine Rust backend - API server with 35 scraper engines"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
image = "0.25"
sled = "0.34"
chacha20poly1305 = "0.10"
base64 = "0.22"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "set-header"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde_regex = "1"
regex = "1"
chrono = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
flate2 = "1"
mime_guess = "2"
bytes = "1"
http = "1"
http-body-util = "0.1"
axum-extra = { version = "0.10", features = ["cookie"] }
once_cell = "1"
tokio-stream = "0.1"
toml = "0.8"
async-trait = "0.1"
