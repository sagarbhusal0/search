[server]
name = "Sorvx"
short_description = "Sorvx — Privacy-focused metasearch engine."
long_description = ""
default_theme = "Dark"
host = "0.0.0.0"
port = 3001
data_dir = "data"
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:151.0) Gecko/20100101 Firefox/151.0"
user_agent_friendly = "Sorvx-search (+https://search.sorvx.com)"
api_enabled = true
instances = []
alt_addresses = []

[bot_protection]
enabled = 1
max_searches = 100
header_regex = "bot|wget|curl|python-requests|scrapy|go-http-client|ruby|yahoo|spider|qwant|meta"
filtered_header_keys = []
captcha_dataset = []

[scrapers]
pixabay_api_key = ""
flickr_api_key = ""
google_cse_cx = ""
soundcloud_client_id = ""

[cors]
allowed_origins = ["http://localhost:3000", "http://localhost:3001"]

[auth]
api_key = ""

[oracles]
enabled = true

[proxies]
# Format: scraper_name = "path/to/proxy_list.txt"
# Proxy list format per line: type:address:port:username:password
# Supported types: http, https, socks4, socks5, socks5h
# Example: http:1.2.3.4:8080:user:pass
# Lines starting with # are comments
ddg = "data/proxies/ddg.txt"
yandex = "data/proxies/yandex.txt"
startpage = "data/proxies/startpage.txt"
