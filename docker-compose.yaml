version: "3.7"

services:
  # PHP Backend API (4get core)
  fourget:
    build: .
    restart: unless-stopped
    environment:
      - FOURGET_PROTO=http
      - FOURGET_SERVER_NAME=localhost
    ports:
      - "8080:80" # PHP UI/API accessible on 8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz.php", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Custom Next.js Frontend
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000" # Expose Next.js on port 3000
    environment:
      - PHP_BACKEND_URL=http://fourget:80
    depends_on:
      fourget:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
